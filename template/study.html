<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>__TITLE__</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --accent:#e05a3f; --accent-ink:#b93a2b; --ink:#2b2622;
    --paper:#fffdf8; --paper-2:#f6efe4; --line:#e6d9c6;
    --songti:"Songti SC","STSong","STKaiti","KaiTi","SimSun",serif;
    --green:#3e9b4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink)}
  body{overflow:hidden}
  #map{position:absolute;inset:0;background:#f0ece3}
  /* 底图风格切换 */
  #styles{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px}
  #styles button{font-size:12px;font-weight:600;color:#6b5c4a;background:rgba(255,253,248,.94);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;
    box-shadow:0 2px 8px rgba(60,40,20,.10);font-family:var(--songti)}
  #styles button.on{color:#fff;background:var(--accent);border-color:var(--accent)}

  /* 顶部标题卡 */
  #header{position:absolute;top:14px;left:14px;z-index:10;max-width:min(400px,calc(100vw - 300px));
    background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 4px 18px rgba(60,40,20,.14);padding:14px 52px 13px 16px}
  #header h1{font-family:var(--songti);font-size:21px;font-weight:700;letter-spacing:2px;line-height:1.25}
  #header .sub{font-family:var(--songti);font-size:12px;color:#8a7a66;margin-top:5px;letter-spacing:1px}
  #header .seal{position:absolute;top:12px;right:14px;width:34px;height:34px;border:2px solid var(--accent);
    color:var(--accent);font-family:var(--songti);font-size:14px;font-weight:700;line-height:31px;
    text-align:center;border-radius:6px;opacity:.9;transform:rotate(5deg)}

  /* 点位标记 */
  .poi-marker{display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .poi-marker .tag{order:1;margin-bottom:5px;font-family:var(--songti);font-size:12px;letter-spacing:.4px;
    color:var(--ink);background:rgba(255,253,248,.95);border:1px solid var(--line);border-radius:7px;
    padding:2px 7px;white-space:nowrap;box-shadow:0 1px 5px rgba(60,40,20,.16);max-width:132px;
    text-overflow:ellipsis;overflow:hidden}
  .poi-marker .pin{order:2;width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--accent);color:#fff;
    border:2px solid #fff;box-shadow:0 3px 8px rgba(60,30,20,.35);display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:700;transform:rotate(-45deg)}
  .poi-marker .pin b{transform:rotate(45deg);font-weight:700}
  .poi-marker.done .pin{background:var(--green)}
  .poi-marker:hover .pin{background:var(--accent-ink)}

  /* 弹窗 */
  .maplibregl-popup-content{padding:0;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(40,25,10,.25);
    border:1px solid var(--line);max-width:300px}
  .card .ph{width:100%;max-height:180px;object-fit:cover;display:block;background:var(--paper-2)}
  .card .bd{padding:12px 14px 13px}
  .card .ttl{font-family:var(--songti);font-size:16px;font-weight:700;line-height:1.35;color:var(--accent-ink)}
  .card .ttl .no{display:inline-block;font-size:11px;color:#fff;background:var(--accent);border-radius:5px;
    padding:1px 6px;margin-right:6px;vertical-align:2px}
  .card .intro{font-size:12.5px;line-height:1.65;color:#4a3f36;margin-top:7px}
  .card .stamp-line{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .card .stamp-line .got{font-family:var(--songti);font-size:12.5px;color:var(--green);font-weight:700}
  .card .stamp-line .not{font-family:var(--songti);font-size:12.5px;color:#9a8a76}
  .card .quiz-btn{margin-top:10px;width:100%;padding:9px 0;font-family:var(--songti);font-size:14px;font-weight:700;
    color:#fff;background:var(--accent);border:none;border-radius:9px;cursor:pointer}
  .card .quiz-btn:hover{background:var(--accent-ink)}
  .card .quiz-btn.done{background:var(--green)}
  .maplibregl-popup-close-button{font-size:18px;color:#9a8a76;padding:4px 8px}

  /* 集章册 */
  #passport{position:absolute;top:14px;right:14px;z-index:10;width:250px;max-height:calc(100vh - 28px);
    background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 4px 18px rgba(60,40,20,.14);display:flex;flex-direction:column;overflow:hidden}
  #passport .hd{padding:12px 14px 9px;border-bottom:1px solid var(--line)}
  #passport .hd .t{font-family:var(--songti);font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
  #passport .hd .t .cnt{font-size:12px;color:#9a8a76;font-weight:500}
  #passport .bar{height:6px;background:var(--paper-2);border-radius:99px;margin-top:8px;overflow:hidden}
  #passport .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .5s}
  #passport .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px;overflow-y:auto}
  .stamp{aspect-ratio:1;border-radius:9px;border:2.5px solid var(--accent);color:var(--accent);
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:var(--songti);font-weight:700;font-size:12px;letter-spacing:1px;line-height:1.15;
    padding:2px;transition:all .35s}
  .stamp.collected{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(224,90,63,.4)}
  .stamp.empty{border-style:dashed;border-color:#d8c8b4;color:#c6b4a0}
  .stamp.slam{animation:slam .5s ease}
  @keyframes slam{0%{transform:scale(1.9) rotate(-8deg)}60%{transform:scale(.92) rotate(2deg)}100%{transform:scale(1) rotate(0)}}

  /* 答题弹层 */
  #quiz-mask{position:absolute;inset:0;z-index:30;background:rgba(40,25,10,.35);display:none;
    align-items:center;justify-content:center}
  #quiz-mask.on{display:flex}
  #quiz{width:min(440px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 12px 40px rgba(40,25,10,.3);padding:18px;position:relative}
  #quiz .qz-close{position:absolute;top:10px;right:12px;font-size:22px;color:#9a8a76;cursor:pointer;background:none;border:none}
  #quiz .qz-stamp{width:56px;height:56px;margin:2px auto 6px;border:3px solid var(--accent);color:var(--accent);
    border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:var(--songti);font-weight:700;font-size:13px;line-height:1.1}
  #quiz .qz-name{text-align:center;font-family:var(--songti);font-size:13px;color:#8a7a76;margin-bottom:12px}
  #quiz .qz-q{font-family:var(--songti);font-size:17px;font-weight:700;line-height:1.4;text-align:center;margin-bottom:14px}
  #quiz .opts{display:flex;flex-direction:column;gap:9px}
  #quiz .opt{padding:11px 14px;font-size:14px;text-align:left;background:var(--paper-2);border:1.5px solid var(--line);
    border-radius:10px;cursor:pointer;transition:all .15s}
  #quiz .opt:hover{border-color:var(--accent)}
  #quiz .opt.correct{background:#e6f4e8;border-color:var(--green);color:#2c6b37}
  #quiz .opt.wrong{background:#fbe9e5;border-color:#d9534f;color:#a3342c}
  #quiz .qz-fb{text-align:center;font-family:var(--songti);font-size:15px;font-weight:700;margin-top:12px;min-height:22px}
  #quiz .qz-fb.ok{color:var(--green)} #quiz .qz-fb.no{color:#d9534f}
  #quiz .qz-next{margin-top:10px;width:100%;padding:10px;font-family:var(--songti);font-size:14px;font-weight:700;
    color:#fff;background:var(--accent);border:none;border-radius:9px;cursor:pointer;display:none}

  /* 完成页 */
  #done-mask{position:absolute;inset:0;z-index:40;background:rgba(255,253,248,.97);display:none;
    align-items:center;justify-content:center;text-align:center}
  #done-mask.on{display:flex}
  #done .big{font-family:var(--songti);font-size:40px;font-weight:700;color:var(--accent);letter-spacing:3px}
  #done .sub{font-family:var(--songti);font-size:16px;color:#8a7a66;margin-top:12px;line-height:1.7}
  #done .again{margin-top:22px;padding:11px 28px;font-family:var(--songti);font-size:15px;font-weight:700;
    color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer}

  /* 定位按钮 + 我的位置点 */
  #locate{position:absolute;right:14px;bottom:150px;z-index:10;width:44px;height:44px;border-radius:10px;
    background:rgba(255,253,248,.96);border:1px solid var(--line);box-shadow:0 2px 8px rgba(60,40,20,.15);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #locate:hover{background:var(--paper-2)}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#1a7af0;border:3px solid #fff;
    box-shadow:0 0 0 6px rgba(26,122,240,.25);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(26,122,240,.3)}50%{box-shadow:0 0 0 10px rgba(26,122,240,.08)}}

  /* 手机端：集章册变底部抽屉、标题缩小、风格竖排 */
  @media (max-width:640px){
    #header{top:10px;left:10px;right:auto;max-width:calc(100vw - 24px);padding:10px 46px 10px 12px}
    #header h1{font-size:17px;letter-spacing:1px}
    #passport{top:auto;right:0;bottom:0;left:0;width:100%;max-height:44vh;border-radius:14px 14px 0 0}
    #passport .grid{grid-template-columns:repeat(5,1fr);gap:7px;padding:9px}
    .stamp{font-size:11px}
    #styles{bottom:auto;top:120px;left:auto;right:10px;transform:none;flex-direction:column;align-items:flex-end}
    #styles button{padding:5px 10px;font-size:11px}
    #locate{right:12px;bottom:calc(44vh + 20px)}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="header">
  <span class="seal">__SEAL__</span>
  <h1>__TITLE__</h1>
  <div class="sub">__SUBTITLE__</div>
</div>

<div id="passport">
  <div class="hd">
    <div class="t"><span>🪪 我的集章册</span><span class="cnt">已集 <b id="got-n">0</b> / <b id="got-total">__NPOI__</b> 枚</span></div>
    <div class="bar"><i id="got-bar"></i></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="styles">
  <button data-s="手账" class="on" onclick="setStyle('手账')">手账</button>
  <button data-s="复古" onclick="setStyle('复古')">复古</button>
  <button data-s="水墨" onclick="setStyle('水墨')">水墨</button>
  <button data-s="标准" onclick="setStyle('标准')">标准</button>
  <button data-s="卫星" onclick="setStyle('卫星')">卫星</button>
</div>

<button id="locate" onclick="locateMe()" title="定位到我">📍</button>

<div id="quiz-mask"><div id="quiz">
  <button class="qz-close" onclick="closeQuiz()">×</button>
  <div class="qz-stamp" id="qz-stamp"></div>
  <div class="qz-name" id="qz-name"></div>
  <div class="qz-q" id="qz-q"></div>
  <div class="opts" id="qz-opts"></div>
  <div class="qz-fb" id="qz-fb"></div>
  <button class="qz-next" id="qz-next" onclick="closeQuiz()">回到地图</button>
</div></div>

<div id="done-mask"><div id="done">
  <div class="big">🎉 研学小侦探！</div>
  <div class="sub">你集齐了全部 __NPOI__ 枚印章，<br>读懂了百载商埠的每一把钥匙！</div>
  <button class="again" onclick="resetStamps()">再玩一次</button>
</div></div>

<script>
const DATA = /*__STUDY_DATA__*/;
const ACCENT = '#e05a3f';
const LS_KEY = 'stamp_' + (DATA.title || 'map');

// ---- 地图（复用漫游地图逻辑：高德瓦片 GCJ-02）----
const SUB = [1,2,3,4];
const roadTiles = SUB.map(s=>`https://wprd0${s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=7`);
const satTiles  = SUB.map(s=>`https://webst0${s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}`);
const lblTiles  = SUB.map(s=>`https://wprd0${s}.is.autonavi.com/appmaptile?x={x}&y={y}&z={z}&lang=zh_cn&size=1&scl=1&style=8&ltype=4`);
const map = new maplibregl.Map({container:'map', style:{version:8,sources:{},layers:[]},
  center:[116.671,23.356], zoom:15.5, attributionControl:false, minZoom:11, maxZoom:19});
const STYLES = {
  '手账': { filter:'sepia(.28) saturate(.78) brightness(1.06) contrast(.92) hue-rotate(-4deg)', tiles:'road' },
  '复古': { filter:'sepia(.6) saturate(.85) contrast(.95) brightness(.98)', tiles:'road' },
  '水墨': { filter:'grayscale(.85) sepia(.12) contrast(1.14) brightness(1.05)', tiles:'road' },
  '标准': { filter:'none', tiles:'road' },
  '卫星': { filter:'none', tiles:'sat' },
};
function setStyle(name){
  const s = STYLES[name]; if(!s) return;
  const cv = document.querySelector('.maplibregl-canvas');
  if(cv) cv.style.filter = s.filter;
  if(map.getLayer('amap-sat')){
    const roadOn = s.tiles === 'road';
    map.setLayoutProperty('amap-road','visibility', roadOn?'visible':'none');
    map.setLayoutProperty('amap-sat','visibility', roadOn?'none':'visible');
    map.setLayoutProperty('amap-lbl','visibility', roadOn?'none':'visible');
  }
  document.querySelectorAll('#styles button').forEach(b=>b.classList.toggle('on', b.dataset.s===name));
}
map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-left');
map.addControl(new maplibregl.NavigationControl({visualizePitch:false}), 'bottom-right');

const collected = new Set(JSON.parse(localStorage.getItem(LS_KEY) || '[]'));
const quizByName = DATA.quiz || {};
let curP = null, curQi = 0;

function dispName(p){ return (quizByName[p.name] && quizByName[p.name].stamp) || p.name; }

map.on('load', ()=>{
  map.addSource('amap-road',{type:'raster',tiles:roadTiles,tileSize:256,maxzoom:18});
  map.addLayer({id:'amap-road',type:'raster',source:'amap-road'});
  map.addSource('amap-sat',{type:'raster',tiles:satTiles,tileSize:256,maxzoom:19});
  map.addLayer({id:'amap-sat',type:'raster',source:'amap-sat',layout:{visibility:'none'}});
  map.addSource('amap-lbl',{type:'raster',tiles:lblTiles,tileSize:256,maxzoom:18});
  map.addLayer({id:'amap-lbl',type:'raster',source:'amap-lbl',layout:{visibility:'none'}});
  setStyle('手账');
  if(DATA.route && DATA.route.features.length){
    map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:DATA.route.features}});
    map.addLayer({id:'route-case',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':7,'line-opacity':.9}});
    map.addLayer({id:'route-line',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':ACCENT,'line-width':3.6}});
  }
  DATA.pois.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'poi-marker' + (collected.has(p.name) ? ' done' : '');
    el.innerHTML = `<div class="tag">${p.name}</div><div class="pin"><b>${String(p.order).padStart(2,'0')}</b></div>`;
    new maplibregl.Marker({element:el, anchor:'bottom'}).setLngLat([p.lng,p.lat])
      .setPopup(new maplibregl.Popup({offset:26, maxWidth:'300px'}).setHTML(cardHTML(p))).addTo(map);
  });
  if(DATA.bounds) map.fitBounds(DATA.bounds, {padding:{top:80,bottom:70,left:40,right:270}, maxZoom:16.5});
});
function cardHTML(p){
  const photo = DATA.photos[p.order] || null;
  const img = photo ? `<img class="ph" src="${photo}">` : '';
  const done = collected.has(p.name);
  const nQ = (quizByName[p.name] && quizByName[p.name].questions) ? quizByName[p.name].questions.length : 0;
  const line = done
    ? `<div class="stamp-line"><span class="got">✅ 已获得「${dispName(p)}」印章</span></div>`
    : `<div class="stamp-line"><span class="not">❓ 集章：回答下面的问题，答对就能盖章</span></div>`;
  const btn = done
    ? `<button class="quiz-btn done">已集章 · 再来看看</button>`
    : (nQ ? `<button class="quiz-btn" onclick="openQuiz('${p.name}')">考考你 · 答对盖章</button>` : '');
  return `<div class="card">${img}<div class="bd">
      <div class="ttl"><span class="no">${String(p.order).padStart(2,'0')}</span>${p.name}</div>
      <div class="intro">${p.intro||''}</div>${line}${btn}</div></div>`;
}
function refreshMarkers(){
  document.querySelectorAll('.poi-marker').forEach((el,i)=>{
    const p = DATA.pois[i];
    el.classList.toggle('done', collected.has(p.name));
  });
}

// ---- 集章册 ----
function buildPassport(){
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  DATA.pois.forEach(p=>{
    const d = document.createElement('div');
    d.className = 'stamp ' + (collected.has(p.name) ? 'collected' : 'empty');
    d.textContent = dispName(p);
    d.title = p.name;
    grid.appendChild(d);
  });
  updatePassport();
}
function updatePassport(){
  const got = collected.size, total = DATA.pois.length;
  document.getElementById('got-n').textContent = got;
  document.getElementById('got-total').textContent = total;
  document.getElementById('got-bar').style.width = (got/total*100)+'%';
  document.querySelectorAll('#grid .stamp').forEach((el,i)=>{
    const p = DATA.pois[i];
    const on = collected.has(p.name);
    el.classList.toggle('collected', on); el.classList.toggle('empty', !on);
  });
  if(got === total && total > 0) document.getElementById('done-mask').classList.add('on');
}

// ---- 答题 ----
function openQuiz(name){
  const qz = quizByName[name]; if(!qz) return;
  curP = DATA.pois.find(p=>p.name===name); curQi = 0;
  document.getElementById('qz-stamp').textContent = dispName(curP);
  document.getElementById('qz-name').textContent = name;
  showQuestion();
  document.getElementById('quiz-mask').classList.add('on');
}
function showQuestion(){
  const qz = quizByName[curP.name];
  const q = qz.questions[curQi];
  document.getElementById('qz-q').textContent = `第 ${curQi+1}/${qz.questions.length} 题 · ${q.q}`;
  document.getElementById('qz-fb').textContent = ''; document.getElementById('qz-fb').className = 'qz-fb';
  document.getElementById('qz-next').style.display = 'none';
  const box = document.getElementById('qz-opts'); box.innerHTML = '';
  q.options.forEach((opt,i)=>{
    const b = document.createElement('div'); b.className = 'opt'; b.textContent = opt;
    b.onclick = ()=>answer(i, b);
    box.appendChild(b);
  });
}
function answer(i, btn){
  const qz = quizByName[curP.name]; const q = qz.questions[curQi];
  const opts = document.querySelectorAll('#qz-opts .opt');
  opts.forEach((o,idx)=>{ o.style.pointerEvents='none'; if(idx===q.answer) o.classList.add('correct'); });
  const fb = document.getElementById('qz-fb');
  if(i === q.answer){
    if(btn) btn.classList.add('correct');
    fb.textContent = '✅ 答对啦！'; fb.className = 'qz-fb ok';
    const first = curQi===0 && !collected.has(curP.name);
    collectStamp(curP);
    const more = curQi+1 < qz.questions.length;
    if(more){
      setTimeout(()=>{ curQi++; showQuestion(); }, 900);
    }else{
      document.getElementById('qz-next').textContent = first ? '收下印章，回地图' : '回地图';
      document.getElementById('qz-next').style.display = 'block';
    }
  }else{
    if(btn) btn.classList.add('wrong');
    fb.textContent = '再想想哦～'; fb.className = 'qz-fb no';
    setTimeout(()=>{ opts.forEach(o=>{ o.style.pointerEvents=''; o.classList.remove('wrong'); }); if(btn) btn.classList.remove('wrong'); }, 700);
  }
}
function collectStamp(p){
  if(collected.has(p.name)) return;
  collected.add(p.name);
  localStorage.setItem(LS_KEY, JSON.stringify([...collected]));
  updatePassport(); refreshMarkers();
  const el = document.querySelectorAll('#grid .stamp')[DATA.pois.findIndex(x=>x.name===p.name)];
  if(el){ el.classList.remove('empty'); el.classList.add('collected','slam'); setTimeout(()=>el.classList.remove('slam'), 550); }
}
function closeQuiz(){ document.getElementById('quiz-mask').classList.remove('on'); }

// ---- 定位（浏览器坐标 WGS-84 → 高德 GCJ-02）----
function wgs2gcj(lng, lat){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271) return [lng,lat];
  const a=6378245.0, ee=0.00669342162296594323; let x=lng-105.0, y=lat-35.0;
  let dlat=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3+(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  let dlng=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3+(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  let rad=lat/180*Math.PI, magic=1-ee*Math.sin(rad)*Math.sin(rad), sm=Math.sqrt(magic);
  dlat=dlat*180/((a*(1-ee))/(magic*sm)*Math.PI); dlng=dlng*180/(a/sm*Math.cos(rad)*Math.PI);
  return [lng+dlng, lat+dlat];
}
let meMarker=null;
function locateMe(){
  if(!navigator.geolocation){ alert('此浏览器不支持定位'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const gcj=wgs2gcj(pos.coords.lng, pos.coords.lat);
    if(meMarker) meMarker.remove();
    const el=document.createElement('div'); el.className='me-dot';
    meMarker=new maplibregl.Marker({element:el}).setLngLat(gcj).addTo(map);
    map.flyTo({center:gcj, zoom:16.5});
  }, ()=>{ alert('定位失败，请在浏览器里允许定位权限'); }, {enableHighAccuracy:true, timeout:10000});
}
function resetStamps(){
  localStorage.removeItem(LS_KEY); collected.clear();
  updatePassport(); refreshMarkers();
  document.getElementById('done-mask').classList.remove('on');
}

document.addEventListener('DOMContentLoaded', ()=>{ buildPassport(); });
